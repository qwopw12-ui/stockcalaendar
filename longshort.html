<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>롱숏 투표 — K-ANT 증시노트</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#191f28;--sub:#4e5968;--muted:#8b95a1;--line:#eef0f3;--up:#e5323b;--down:#2f6fe4;--navy:#1b3a8f}
html.kdark{--bg:#1d2025;--card:#2a2e35;--ink:#e6e8ec;--sub:#a4abb6;--muted:#7d8591;--line:#3a3f48;--up:#f0565e;--down:#5b8ff0;--navy:#8fb0ff;color-scheme:dark}
html.kdark .long{background:#3a2629}html.kdark .short{background:#232c3d}html.kdark .card{box-shadow:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:4px 18px 40px}
.card{background:var(--card);border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.05);padding:26px 28px}
.vote{position:relative;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.kick{font-size:14px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#1a9b4b}
.live i{width:8px;height:8px;border-radius:50%;background:#1a9b4b;animation:p 1.8s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(26,155,75,.45)}70%{box-shadow:0 0 0 7px rgba(26,155,75,0)}100%{box-shadow:0 0 0 0 rgba(26,155,75,0)}}
h1{font-size:34px;font-weight:900;letter-spacing:-1px;margin:10px 0 4px}
.meta{font-size:14px;color:var(--muted);font-weight:600}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.btn{border:2px solid transparent;border-radius:16px;padding:20px 18px;cursor:pointer;font:inherit;text-align:left;transition:transform .08s,box-shadow .15s;display:flex;align-items:center;gap:14px}
.btn:active{transform:scale(.98)}
.btn .ic{font-size:30px;line-height:1;width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
.btn b{display:block;font-size:26px;font-weight:900;letter-spacing:-.5px}
.btn small{display:block;font-size:14px;font-weight:600;margin-top:2px;opacity:.8}
.long{background:#fff1f1;color:var(--up)}.long .ic{background:var(--up);color:#fff}
.short{background:#eef4ff;color:var(--down)}.short .ic{background:var(--down);color:#fff}
.btn.sel{border-color:currentColor;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.btn.sel:after{content:"내 선택";margin-left:auto;font-size:13px;font-weight:800;border-radius:999px;padding:5px 10px;color:#fff}
.long.sel:after{background:var(--up)}.short.sel:after{background:var(--down)}
.btn:disabled{cursor:default;opacity:.55}
.res{margin-top:22px}
.bar{display:flex;height:44px;border-radius:12px;overflow:hidden;background:var(--line);font-weight:900;font-size:17px;color:#fff}
.bar div{display:flex;align-items:center;transition:width .6s cubic-bezier(.2,.8,.2,1);white-space:nowrap;min-width:0}
.bar .l{background:var(--up);justify-content:flex-start;padding-left:14px}
.bar .s{background:var(--down);justify-content:flex-end;padding-right:14px}
.cnt{display:flex;justify-content:space-between;margin-top:8px;font-size:14px;font-weight:700}
.cnt .l{color:var(--up)}.cnt .s{color:var(--down)}.cnt .t{color:var(--muted)}
.note{margin-top:14px;font-size:13px;color:var(--muted);line-height:1.5}
.sec{display:flex;align-items:baseline;gap:8px;font-size:20px;font-weight:800;margin:34px 4px 12px}
.sec small{font-size:13px;color:var(--muted);font-weight:600}
.chart{padding:18px 18px 10px}
.ch{display:flex;justify-content:space-between;align-items:flex-start;padding:0 4px 6px}
.ch .nm{font-size:15px;color:var(--muted);font-weight:700}
.ch .px{font-size:28px;font-weight:900;letter-spacing:-.5px;margin-top:2px}
.ch .px span{font-size:.62em;margin-left:8px}
.up{color:var(--up)}.down{color:var(--down)}
.cv{position:relative}.cv canvas{display:block;width:100%;height:360px;cursor:grab;touch-action:pan-y}.cv canvas:active{cursor:grabbing}
.zb{display:flex;gap:6px}.zb button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--sub);font:700 16px/1 inherit;cursor:pointer}.zb button:hover{background:var(--line)}
.mal{display:flex;gap:6px;align-items:center;padding:2px 4px 8px;flex-wrap:wrap}.mal button{font:700 11.5px/1 inherit;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:5px 9px;cursor:pointer}.mal button.on{color:var(--c);border-color:var(--c)}.mal button:before{content:'';display:inline-block;width:10px;height:2px;background:currentColor;vertical-align:3px;margin-right:4px}.mal .d{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.tip{position:absolute;pointer-events:none;background:rgba(25,31,40,.92);color:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.5;display:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.flip .ch .nm.t:after{content:"위아래 뒤집음";margin-left:8px;font-size:11.5px;font-weight:800;color:#fff;background:#7048e8;border-radius:6px;padding:3px 7px;vertical-align:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}h1{font-size:27px}.btn b{font-size:22px}.cv canvas{height:280px}}
.foot{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}
</style></head><body><div class="wrap">
<div class="card vote">
 <div class="top"><div><div class="kick">K-ANT 롱숏 투표 <span class="live" id="live"><i></i>실시간</span></div>
 <h1 id="q">내일 국내증시, 롱? 숏?</h1><div class="meta" id="meta"></div></div></div>
 <div class="btns">
  <button class="btn long" id="bL"><span class="ic">▲</span><span><b>롱</b><small>오른다 · 코스피 상승</small></span></button>
  <button class="btn short" id="bS"><span class="ic">▼</span><span><b>숏</b><small>내린다 · 코스피 하락</small></span></button>
 </div>
 <div class="res"><div class="bar"><div class="l" id="pl" style="width:50%">50%</div><div class="s" id="ps" style="width:50%">50%</div></div>
 <div class="cnt"><span class="l" id="cl">롱 0명</span><span class="t" id="ct">총 0명 참여</span><span class="s" id="cs">숏 0명</span></div></div>
 <div class="note" id="note">한 사람당 한 표, 마감 전까지는 바꿀 수 있어요. 결과는 다음 거래일 코스피 종가로 판정해요.</div>
</div>
<div class="sec">코스피 <small>일봉 · 휠·드래그로 확대/이동</small></div>
<div class="card chart" id="kospi"></div>
<div class="sec">나스닥 <small>일봉 · 미국 종합지수</small></div>
<div class="card chart" id="nasdaq"></div>
<div class="sec">삼성전자 <small>일봉 · 정방향 vs 거꾸로</small></div>
<div class="grid2"><div class="card chart" id="sec"></div><div class="card chart flip" id="secf"></div></div>
<div class="sec">SK하이닉스 <small>일봉 · 정방향 vs 거꾸로</small></div>
<div class="grid2"><div class="card chart" id="hynix"></div><div class="card chart flip" id="hynixf"></div></div>
<div class="foot">K-ANT 증시노트 · 투자 권유가 아니에요. 재미로 참여해 주세요.</div>
</div>
<script>
let C={};
const pad=n=>String(n).padStart(2,'0');
const fmt=(v,d)=>v.toLocaleString('ko-KR',{minimumFractionDigits:d,maximumFractionDigits:d});
/* ---------- 투표 대상 거래일 ---------- */
const HOL=['2026-12-25','2026-12-31','2027-01-01','2027-02-08','2027-02-09','2027-03-01','2027-03-03'];
const kst=()=>new Date(Date.now()+9*3600e3);
const ymd=d=>`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
const isTD=d=>{const w=d.getUTCDay();return w>0&&w<6&&!HOL.includes(ymd(d))};
// 투표 대상: 마감(대상 거래일 전날 23:30)이 아직 안 지난 가장 가까운 거래일
function target(){const now=kst();let t=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate()));
 for(;;){t=new Date(t.getTime()+864e5);if(!isTD(t))continue;if(now<new Date(t.getTime()-864e5+23.5*3600e3))return t}}
const T=target(),DAY=ymd(T),DW='일월화수목금토'[T.getUTCDay()];
document.getElementById('q').textContent=`${T.getUTCMonth()+1}월 ${T.getUTCDate()}일(${DW}) 국내증시, 롱? 숏?`;
const DL=new Date(T.getTime()-864e5);document.getElementById('meta').textContent=`코스피 기준 · ${DL.getUTCMonth()+1}/${DL.getUTCDate()}(${'일월화수목금토'[DL.getUTCDay()]}) 23:30 마감`;
/* ---------- 투표 (서버: /api/vote) ---------- */
let mySide=null,L=0,S=0,DAYK=DAY;
const VID=(()=>{try{let v=localStorage.getItem('lsvid');if(!v){v=[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(36).padStart(2,'0')).join('').slice(0,24);localStorage.setItem('lsvid',v)}return v}catch(e){return 'x'+Math.random().toString(36).slice(2).padEnd(20,'0')}})();
const myKey=d=>'lsvote:'+d;
try{mySide=localStorage.getItem(myKey(DAYK))}catch(e){}
function drawVote(){const t=L+S,pl=t?Math.round(L/t*100):50,ps=t?100-pl:50;
 const a=document.getElementById('pl'),b=document.getElementById('ps');a.style.width=pl+'%';b.style.width=ps+'%';a.textContent=pl>=12?pl+'%':'';b.textContent=ps>=12?ps+'%':'';
 document.getElementById('cl').textContent=`롱 ${L.toLocaleString()}명`;document.getElementById('cs').textContent=`숏 ${S.toLocaleString()}명`;document.getElementById('ct').textContent=`총 ${t.toLocaleString()}명 참여`;
 document.getElementById('bL').classList.toggle('sel',mySide==='long');document.getElementById('bS').classList.toggle('sel',mySide==='short')}
function setTarget(day,deadline){if(day===DAYK)return;DAYK=day;const t=new Date(day+'T00:00:00Z'),dl=new Date(Date.parse(deadline)+9*3600e3),w='일월화수목금토';
 document.getElementById('q').textContent=`${t.getUTCMonth()+1}월 ${t.getUTCDate()}일(${w[t.getUTCDay()]}) 국내증시, 롱? 숏?`;
 document.getElementById('meta').textContent=`코스피 기준 · ${dl.getUTCMonth()+1}/${dl.getUTCDate()}(${w[dl.getUTCDay()]}) ${String(dl.getUTCHours()).padStart(2,'0')}:${String(dl.getUTCMinutes()).padStart(2,'0')} 마감`;
 try{mySide=localStorage.getItem(myKey(day))}catch(e){mySide=null}}
let busy=false,pend=0;
async function load(){if(document.hidden||Date.now()<pend)return;try{const j=await(await fetch('/api/vote',{cache:'no-store'})).json();if(j.ok){setTarget(j.day,j.deadline);L=j.long;S=j.short;drawVote();document.getElementById('live').style.display=''}}catch(e){document.getElementById('live').style.display='none'}}
async function vote(side){if(busy||side===mySide)return;busy=true;const prev=mySide;
 if(prev==='long')L--;if(prev==='short')S--;side==='long'?L++:S++;mySide=side;drawVote();pend=Date.now()+4000;
 try{const r=await fetch('/api/vote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({side,vid:VID})});const j=await r.json();
  if(!j.ok)throw new Error(j.error||r.status);try{localStorage.setItem(myKey(j.day),side)}catch(e){}document.getElementById('note').textContent='한 사람당 한 표, 마감 전까지는 바꿀 수 있어요. 결과는 다음 거래일 코스피 종가로 판정해요.'}
 catch(e){if(side==='long')L--;else S--;if(prev==='long')L++;if(prev==='short')S++;mySide=prev;drawVote();document.getElementById('note').textContent=String(e.message)==='too many'?'같은 인터넷 주소에서 투표가 너무 많아요. 잠시 후 다시 해주세요.':'투표가 저장되지 않았어요. 잠시 후 다시 눌러 주세요.'}
 busy=false}
document.getElementById('bL').onclick=()=>vote('long');document.getElementById('bS').onclick=()=>vote('short');
drawVote();load();setInterval(load,5000);document.addEventListener('visibilitychange',load);
/* ---------- 캔들 차트 (확대·축소·이동, 이동평균 5·10·20·60·120) ---------- */
const MAS=[[5,'#f59f00'],[10,'#12b886'],[20,'#7048e8'],[60,'#e64980'],[120,'#868e96']];
let MAON=(()=>{try{return JSON.parse(localStorage.getItem('lsma'))||[1,1,1,1,1]}catch(e){return [1,1,1,1,1]}})();
const CHARTS=[];
function chart(el,name,rows,dec,unit,flip){
 const N=rows.length,last=rows[N-1],prev=rows[N-2],chg=last[4]-prev[4],r=chg/prev[4]*100,cls=chg>0?'up':chg<0?'down':'';
 const fc=flip?(chg<0?'up':chg>0?'down':''):cls,fr=flip?-r:r;
 el.innerHTML=`<div class="ch"><div><div class="nm t">${name}</div><div class="px ${fc}">${fmt(last[4],dec)}${unit}<span>${flip?`숏 기준 ${fr>0?'+':''}${fr.toFixed(2)}%`:`${chg>0?'▲':chg<0?'▼':''} ${fmt(Math.abs(chg),dec)} (${r>0?'+':''}${r.toFixed(2)}%)`}</span></div></div><div class="zb"><button data-z="in" title="확대">＋</button><button data-z="out" title="축소">－</button><button data-z="reset" title="처음 보기">↺</button></div></div>
 <div class="mal">${MAS.map(([n,c],k)=>`<button data-k="${k}" style="--c:${c}" class="${MAON[k]?'on':''}">${n}</button>`).join('')}<span class="d">${last[0].slice(0,4)}.${last[0].slice(4,6)}.${last[0].slice(6)} 종가</span></div><div class="cv"><canvas></canvas><div class="tip"></div></div>`;
 const cv=el.querySelector('canvas'),tip=el.querySelector('.tip');let hx=null;
 const ma=n=>{const o=new Array(N).fill(null);let sum=0;for(let i=0;i<N;i++){sum+=rows[i][4];if(i>=n)sum-=rows[i-n][4];if(i>=n-1)o[i]=sum/n}return o};const MA=MAS.map(([n])=>ma(n));
 const DEF=Math.min(120,N),MIN=15;let s0=N-DEF,cnt=DEF;          // 보이는 구간: rows[s0 .. s0+cnt)
 const clamp=()=>{cnt=Math.max(MIN,Math.min(N,cnt));s0=Math.max(0,Math.min(N-cnt,s0))};
 let G={};
 function draw(){const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);
  const vis=rows.slice(Math.floor(s0),Math.floor(s0)+cnt),b0=Math.floor(s0);
  c.font='11px Pretendard,sans-serif';const lw=c.measureText(fmt(Math.max(...vis.map(x=>x[2])),0)).width;
  const x0=6,x1=W-lw-14,y0=10,vh=46,y1=H-26-vh,vy0=H-22-vh+6,vy1=H-22;
  let lo=Infinity,hi=-Infinity,vmax=0;vis.forEach(x=>{lo=Math.min(lo,x[3]);hi=Math.max(hi,x[2]);vmax=Math.max(vmax,x[5])});const pv=(hi-lo)*.06||1;lo-=pv;hi+=pv;
  const Y=v=>flip?y0+(v-lo)/(hi-lo)*(y1-y0):y1-(v-lo)/(hi-lo)*(y1-y0);
  const st=(x1-x0)/cnt,bw=Math.max(1,st*.64),X=k=>x0+st*(k+.5);G={x0,x1,st,b0};
  const css=getComputedStyle(document.documentElement),UP=css.getPropertyValue('--up').trim(),DN=css.getPropertyValue('--down').trim();
  c.textBaseline='middle';c.fillStyle=css.getPropertyValue('--muted').trim();c.strokeStyle=css.getPropertyValue('--line').trim();c.lineWidth=1;
  const rg=hi-lo,m=Math.pow(10,Math.floor(Math.log10(rg/4))),stp=[1,2,2.5,5,10].map(k=>k*m).find(k=>rg/k<=5);
  for(let v=Math.ceil(lo/stp)*stp;v<=hi;v+=stp){const y=Math.round(Y(v))+.5;c.beginPath();c.moveTo(x0,y);c.lineTo(x1,y);c.stroke();c.fillText(fmt(v,stp<1?2:0),x1+6,y)}
  // 날짜 (간격 맞춰 월/연 표시)
  c.textBaseline='top';c.textAlign='center';let lm='',lx=-99;vis.forEach((x,k)=>{const m2=x[0].slice(4,6);if(m2!==lm&&k>0){const xx=X(k);if(xx-lx>44){c.fillText(m2==='01'?x[0].slice(2,4)+'년':+m2+'월',xx,vy1+4);lx=xx}}lm=m2});c.textAlign='left';
  c.save();c.beginPath();c.rect(x0,0,x1-x0,H);c.clip();
  vis.forEach((x,k)=>{const u=x[4]>=x[1];c.fillStyle=(flip?!u:u)?UP+'55':DN+'55';const h=x[5]/vmax*(vy1-vy0);c.fillRect(X(k)-bw/2,vy1-h,bw,h)});
  vis.forEach((x,k)=>{const [d,o,h,l,cl]=x;const u=flip?cl<o:cl>=o;c.strokeStyle=c.fillStyle=u?UP:DN;
   c.beginPath();c.moveTo(Math.round(X(k))+.5,Y(h));c.lineTo(Math.round(X(k))+.5,Y(l));c.stroke();const ya=Y(o),yb=Y(cl);c.fillRect(X(k)-bw/2,Math.min(ya,yb),bw,Math.max(1,Math.abs(yb-ya)))});
  c.beginPath();c.rect(x0,y0-4,x1-x0,y1-y0+8);c.clip();
  MAS.forEach(([n,col],q)=>{if(!MAON[q])return;c.beginPath();let st2=false;for(let k=-1;k<=cnt;k++){const v=MA[q][b0+k];if(v==null)continue;st2?c.lineTo(X(k),Y(v)):(c.moveTo(X(k),Y(v)),st2=true)}c.strokeStyle=col;c.lineWidth=1.3;c.stroke()});
  c.restore();
  if(hx!=null&&hx>=x0&&hx<=x1){const k=Math.min(cnt-1,Math.max(0,Math.floor((hx-x0)/st))),i=b0+k,x=rows[i];c.strokeStyle='#9aa1ab';c.setLineDash([3,3]);c.beginPath();c.moveTo(Math.round(X(k))+.5,y0);c.lineTo(Math.round(X(k))+.5,vy1);c.stroke();c.setLineDash([]);
   const p=i?rows[i-1][4]:x[1],rr=(x[4]-p)/p*100,mas=MAS.map(([n,col],q)=>MAON[q]&&MA[q][i]!=null?`<span style="color:${col}">${n}일 ${fmt(MA[q][i],dec)}</span>`:'').filter(Boolean).join('<br>');
   tip.innerHTML=`<b>${x[0].slice(0,4)}.${x[0].slice(4,6)}.${x[0].slice(6)}</b><br>시가 ${fmt(x[1],dec)}<br>고가 ${fmt(x[2],dec)}<br>저가 ${fmt(x[3],dec)}<br>종가 ${fmt(x[4],dec)} <span style="color:${rr>=0?'#ff8a8f':'#8fb4ff'}">${rr>=0?'+':''}${rr.toFixed(2)}%</span>${mas?'<br>'+mas:''}`;
   tip.style.display='block';const tw=tip.offsetWidth;tip.style.left=(X(k)+12+tw>W?X(k)-tw-12:X(k)+12)+'px';tip.style.top='8px'}else tip.style.display='none'}
 const zoom=(f,cx)=>{const {x0,x1}=G;const r0=cx==null?1:Math.max(0,Math.min(1,(cx-x0)/(x1-x0))),at=s0+cnt*r0;cnt=Math.round(cnt*f);clamp();s0=at-cnt*r0;clamp();draw()};
 el.querySelector('.zb').onclick=e=>{const z=e.target.dataset.z;if(z==='in')zoom(.7);else if(z==='out')zoom(1/.7);else if(z==='reset'){cnt=DEF;s0=N-DEF;clamp();draw()}};
 el.querySelector('.mal').onclick=e=>{const k=e.target.dataset.k;if(k==null)return;MAON[k]=MAON[k]?0:1;try{localStorage.setItem('lsma',JSON.stringify(MAON))}catch(_){}CHARTS.forEach(f=>f.sync())};
 cv.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY>0?1.15:1/1.15,e.offsetX)},{passive:false});
 let drag=null;
