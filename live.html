<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해외 실시간 추정가 — 삼성전자 · SK하이닉스</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#eef1f5; --card:#fff; --ink:#191f28; --sub:#4e5968; --muted:#8b95a1;
    --line:#eef0f3; --up:#e5323b; --down:#2f6fe4; --flat:#4e5968; --live:#1a9b4b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;padding:28px 16px}
  .wrap{max-width:1040px;margin:0 auto}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin:0 4px 14px;font-size:13px;color:var(--sub);gap:12px;flex-wrap:wrap}
  .topbar b{color:var(--ink);font-weight:600}
  .status{display:flex;align-items:center;gap:8px}
  .pill{background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;color:var(--sub);box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .pill.err{color:#c62828}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .card{background:var(--card);border-radius:18px;padding:22px 24px 20px;position:relative;
    box-shadow:0 1px 3px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04)}
  .head{display:flex;align-items:center;gap:12px}
  .logo{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none;overflow:hidden;background:#f2f4f6}
  .logo img{width:100%;height:100%;object-fit:cover;display:block}
  .logo span{display:none}
  .logo.fb{background:var(--c)} .logo.fb span{display:block}
  .name{font-size:28px;font-weight:700;letter-spacing:-.5px}
  .gear{position:absolute;top:18px;right:18px;width:28px;height:28px;border:0;background:none;cursor:pointer;color:#9aa4b0;border-radius:8px;display:grid;place-items:center}
  .gear:hover{background:#f2f4f6;color:var(--sub)}
  .src{margin-top:14px;font-size:13px;font-weight:600;color:var(--live);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(26,155,75,.5)}
  .dot.pulse{animation:pulse 1.2s ease-out}
  .dot.stale{background:#c0c6cd}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(26,155,75,.55)}100%{box-shadow:0 0 0 9px rgba(26,155,75,0)}}
  .price{margin-top:4px;display:flex;align-items:baseline;gap:8px}
  .price .v{font-size:42px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums;border-radius:8px;padding:0 4px;margin-left:-4px;transition:background-color .9s}
  .price .v.flash-up{background:rgba(229,50,59,.14);transition:none}
  .price .v.flash-down{background:rgba(47,111,228,.14);transition:none}
  .price .u{font-size:18px;color:var(--sub)}
  .usd{font-size:14px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  .chg{margin-top:14px;font-size:18px;color:var(--sub);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
  .chg .amt,.chg .pct{font-weight:700}
  .chg .sep{color:#d1d6db}
  .up{color:var(--up)!important} .down{color:var(--down)!important} .flat{color:var(--flat)!important}
  .rows{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
  .row{display:flex;justify-content:space-between;font-size:14px}
  .row span:first-child{color:var(--sub)}
  .row span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
  .foot{margin:16px 4px 0;font-size:12px;color:var(--muted);line-height:1.6}
  /* settings panel */
  .panel{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
  .card.editing .panel{display:block}
  .panel label{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-bottom:8px}
  .panel input{font:inherit;font-size:14px;padding:7px 10px;border:1px solid #dde1e6;border-radius:8px;width:100%;font-variant-numeric:tabular-nums}
  .panel .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
  .panel button{font:inherit;font-size:13px;padding:7px 14px;border-radius:8px;border:0;cursor:pointer}
  .panel .save{background:#3182f6;color:#fff} .panel .cancel{background:#f2f4f6;color:var(--sub)}
  .panel .hint{font-size:12px;color:var(--muted);margin:2px 0 8px}
  .sec-h{margin:26px 4px 12px;font-size:17px;font-weight:700;color:var(--ink)}
  .sec-h small{font-size:12px;font-weight:500;color:var(--muted);margin-left:6px}
  .krw{font-size:14px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  .src{display:none!important}
  .fxbox{display:inline-flex;align-items:baseline;gap:10px;background:var(--card);border-radius:12px;padding:10px 16px;font-size:15px;font-weight:600;color:var(--sub);box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .fxbox b{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.3px;font-variant-numeric:tabular-nums}
  .nightf{display:block;width:100%;height:460px;border:0;background:transparent}
  .chg{font-size:14px;gap:6px}
  /* compact cards */
  .card{padding:16px 20px 14px}
  .head{gap:10px}
  .logo{width:38px;height:38px;font-size:13px}
  .name{font-size:22px}
  .price{margin-top:6px}
  .price .v{font-size:34px}
  .price .u{font-size:15px}
  .chg{margin-top:8px;font-size:15px}
  .rows{margin-top:10px;padding-top:9px}
  .row{font-size:13px}
  .grid{gap:14px}
  .sec-h{margin:20px 4px 10px}
  .spark{display:block;width:100%;height:46px;margin-top:8px}
  .chg .lbl{display:none}
  .card{min-width:0}
  .head{min-width:0;align-items:center}
  .head .name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
  .head .name>span{display:block;font-size:13px!important;margin-top:2px}
  .head .chg{margin:0 0 0 auto;flex-direction:column;align-items:flex-end;gap:1px;white-space:nowrap;flex-shrink:0;font-size:20px;line-height:1.2}
  .head .chg .sep{display:none}
  .head{align-items:flex-start}
  .head .name{padding-top:0}
  .head .logo{width:42px;height:42px}
  .head .chg{align-self:flex-start}
  .head .chg .pct{order:1;font-size:1.3em;line-height:1}
  .head .chg .amt{order:2;margin-top:3px}
  .rows:has(.cap){display:none}
  .head .name{font-size:21px}.head .chg{font-size:17px}
  .tops{display:flex;gap:10px;flex-wrap:wrap}
  .ekc{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;display:inline-flex;gap:6px}
  .tops .fxbox{white-space:nowrap}
  .ekc.up{color:var(--up)} .ekc.down{color:var(--down)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="tops">
      <div class="fxbox"><span><span class="fxl">원/달러 </span>환율</span> <b id="fx">—</b></div>
      <div class="fxbox ekbox">예상 코스피 <b id="ek">—</b><span class="ekc" id="ekc"></span></div>
    </div>
  </div>
  <div class="sec-h" style="margin-top:0">한국 반도체 <small>KRX 종가 대비 · 원</small></div>
  <div class="grid" id="grid"></div>
  <div class="sec-h">미국 반도체 <small>정규장 종가 대비 · 달러</small></div>
  <div class="grid" id="usgrid"></div>
  <div class="sec-h">코스피200 야간선물</div>
  <iframe id="nightFrame" class="nightf" title="코스피200 야간선물" src="night.html"></iframe>
  <div class="sec-h">나스닥100</div>
  <iframe class="nightf usf" title="나스닥100" src="usfut.html?coin=xyz:XYZ100&name=NASDAQ100"></iframe>
  <div class="sec-h">S&amp;P500</div>
  <iframe class="nightf usf" title="S&P500" src="usfut.html?coin=xyz:SP500&name=S%26P500"></iframe>
  <div class="sec-h">미국 빅테크 <small>정규장 종가 대비 · 달러</small></div>
  <div class="grid" id="biggrid"></div>
</div>

<script>
const API = 'https://api.hyperliquid.xyz/info';
const REFRESH_SEC = 10;
const FX_COIN = 'xyz:KRW';
const CLOSE_API = '/api/krx-close';      // Netlify 함수: 네이버 KRX 종가
const CLOSE_REFRESH_MIN = 10;

// 기본값: 자동 조회가 안 될 때만 쓰는 비상용 값 (2026-11-17 KRX 종가)
const STOCKS = [
  { id:'samsung', code:'005930', name:'삼성전자', coin:'xyz:SMSN', logo:'S', color:'#1428a0',
    defaults:{ refDate:'11/17', close:190300, marketCap:1112546819102400, low52:94500, high52:374500 } },
  { id:'skhynix', code:'000660', name:'SK하이닉스', coin:'xyz:SKHX', logo:'SK', color:'#e3001b',
    defaults:{ refDate:'11/17', close:1098000, marketCap:776065404114000, low52:501000, high52:2987000 } },
];

// 바이비트 → 실패 시 게이트에서 호가 중간가(USD) 조회
async function fetchCexMid(s){
  try{
    const r = await fetch(`https://api.bybit.com/v5/market/tickers?category=linear&symbol=${s.symbol}`);
    const t = (await r.json()).result.list[0];
    const bid = Number(t.bid1Price), ask = Number(t.ask1Price);
    const px = bid > 0 && ask > 0 ? (bid + ask) / 2 : Number(t.markPrice || t.lastPrice);
    if (px > 0) return { px, src:'Bybit' };
  }catch(e){}
  const r = await fetch(`https://api.gateio.ws/api/v4/futures/usdt/tickers?contract=${s.gateContract}`);
  const t = (await r.json())[0];
  const bid = Number(t.highest_bid), ask = Number(t.lowest_ask);
  const px = bid > 0 && ask > 0 ? (bid + ask) / 2 : Number(t.mark_price || t.last);
  if (px > 0) return { px, src:'Gate' };
  throw new Error('no price');
}

const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
STOCKS.forEach(s => { s.manual = null; try{ localStorage.removeItem('kl_manual_'+s.id); }catch(e){} s.auto = store.get('kl_auto_'+s.id); s.last = null; });

// 우선순위: 같은 기준일에 직접 고친 값 > 자동 조회값 > 직접 입력값 > 비상용 기본값
function cfgOf(s){
  if (s.manual && (!s.auto || s.manual.refDate === s.auto.refDate)) return Object.assign({}, s.defaults, s.auto || {}, s.manual);
  if (s.auto) return Object.assign({}, s.defaults, s.auto);
  return Object.assign({}, s.defaults, s.manual || {});
}

async function loadClose(){
  try{
    const r = await fetch(CLOSE_API + '?codes=' + STOCKS.map(s => s.code).join(','), { cache:'no-cache' });
    const j = await r.json();
    (j.stocks || []).forEach(d => {
      const s = STOCKS.find(x => x.code === d.code);
      if (!s || !d.close || !d.date) return;
      const a = { refDate: `${+d.date.slice(4,6)}/${+d.date.slice(6,8)}`, close: d.close };
      if (d.marketCap) a.marketCap = d.marketCap;
      if (d.low52) a.low52 = d.low52;
      if (d.high52) a.high52 = d.high52;
      s.auto = a; store.set('kl_auto_'+s.id, a);
      render(s);
    });
  }catch(e){ console.warn('종가 자동 조회 실패 — 저장된 값/기본값 사용', e); }
}

const won = n => Math.round(n).toLocaleString('ko-KR');
function fmtCap(n){
  const jo = Math.floor(n / 1e12), eok = Math.round((n % 1e12) / 1e8);
  if (jo && eok) return `${jo.toLocaleString('ko-KR')}조 ${eok.toLocaleString('ko-KR')}억 원`;
  if (jo) return `${jo.toLocaleString('ko-KR')}조 원`;
  return `${eok.toLocaleString('ko-KR')}억 원`;
}


function buildCards(){
  const grid = document.getElementById('grid');
  grid.innerHTML = STOCKS.map(s => `
    <div class="card" id="c-${s.id}">
      <div class="head">
        <div class="logo" style="--c:${s.color}"><img src="https://ssl.pstatic.net/imgstock/fn/real/logo/stock/Stock${s.code}.svg" alt="${s.name} 로고" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('fb');this.remove()"><span>${s.logo}</span></div>
        <div class="name">${s.name} <span style="font-size:15px;color:var(--muted);font-weight:600">${s.code}</span></div>
      </div>
      <div class="src"><span class="dot stale"></span><span class="srcname">${s.src === 'bybit' ? 'Bybit' : 'Hyperliquid'}</span>해외 실시간 추정가</div>
      <div class="price"><span class="v">—</span><span class="u">원</span></div>
      <div class="chg"><span class="lbl"></span><span class="amt"></span><span class="sep">|</span><span class="pct"></span></div>
      <canvas class="spark" data-coin="${s.coin||''}"></canvas>
      <div class="rows">
        <div class="row"><span>시가총액</span><span class="cap"></span></div>
      </div>
    </div>`).join('');
}

let fx = null, fxSource = '';

function render(s){
  const card = document.getElementById('c-'+s.id);
  const cfg = cfgOf(s);
  card.querySelector('.cap').textContent = fmtCap(cfg.marketCap);
  card.querySelector('.chg .lbl').textContent = `${cfg.refDate} 종가 대비`;
  if (s.usd == null || !fx) return;

  const krw = s.usd * fx;
  const diff = krw - cfg.close;
  const pct = diff / cfg.close * 100;
  const cls = Math.abs(diff) < 0.5 ? 'flat' : diff > 0 ? 'up' : 'down';
  const arrow = cls==='up' ? '▲' : cls==='down' ? '▼' : '';

  const v = card.querySelector('.price .v');
  const newText = '₩' + won(krw);
  if (s.last != null && Math.round(krw) !== Math.round(s.last)) {
    v.classList.remove('flash-up','flash-down'); void v.offsetWidth;
    v.classList.add(krw > s.last ? 'flash-up' : 'flash-down');
    setTimeout(() => v.classList.remove('flash-up','flash-down'), 60);
  }
  v.textContent = newText;
  s.last = krw;

  const amt = card.querySelector('.chg .amt'), p = card.querySelector('.chg .pct');
  amt.className = 'amt ' + cls; p.className = 'pct ' + cls;
  amt.textContent = `${arrow} ${won(Math.abs(diff))}원`;
  p.textContent = `${pct>0?'+':''}${pct.toFixed(2)}%`;

  const dot = card.querySelector('.dot');
  dot.classList.remove('stale','pulse'); void dot.offsetWidth; dot.classList.add('pulse');
}

async function getFxFallback(){
  const r = await fetch('https://open.er-api.com/v6/latest/USD');
  const j = await r.json();
  return j && j.rates && j.rates.KRW;
}

async function refreshCex(){
  await Promise.all(STOCKS.filter(s => s.src).map(async s => {
    try{
      const { px, src } = await fetchCexMid(s);
      s.usd = px;
      document.querySelector(`#c-${s.id} .srcname`).textContent = src;
      render(s);
    }catch(e){
      const d = document.querySelector(`#c-${s.id} .dot`); if (d) d.classList.add('stale');
    }
  }));
}

async function refresh(){
  const updated = document.getElementById('updated') || { set className(v){}, set textContent(v){} };
  try{
    const res = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ type:'metaAndAssetCtxs', dex:'xyz' }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const [meta, ctxs] = await res.json();
    const byName = {};
    meta.universe.forEach((u,i) => byName[u.name] = ctxs[i]);

    // 환율: Hyperliquid xyz:KRW 오라클 → 실패 시 공개 환율 API
    const k = byName[FX_COIN];
    const fxHL = k && Number(k.oraclePx || k.markPx);
    if (fxHL > 500) { fx = fxHL; fxSource = '(Hyperliquid)'; }
    else if (!fx) { const f = await getFxFallback().catch(()=>null); if (f) { fx = f; fxSource = '(open.er-api)'; } }
    document.getElementById('fx').textContent = fx ? fx.toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2}) + '원' : '—';

    refreshCex();   // 환율이 정해진 뒤 삼성전기(바이비트) 조회
    STOCKS.filter(s => !s.src).forEach(s => {
      const c = byName[s.coin];
      if (!c) return;
      const px = Number(c.midPx || c.markPx);   // 호가 중간가, 없으면 마크가
      if (px > 0) s.usd = px;
      render(s);
    });

    const t = new Date();
    updated.className = 'pill';
    updated.textContent = '업데이트 ' + t.toLocaleTimeString('en-GB');
  }catch(e){
    updated.className = 'pill err';
    updated.textContent = '불러오기 실패 — 다음 갱신 때 재시도';
    if (fx) refreshCex();
    document.querySelectorAll('.dot').forEach(d => d.classList.add('stale'));
    console.error(e);
  }
}

buildCards();
STOCKS.forEach(render);
let left = REFRESH_SEC;
loadClose();
setInterval(loadClose, CLOSE_REFRESH_MIN * 60e3);
refresh();
setInterval(() => {
  left -= 1;
  if (left <= 0) { left = REFRESH_SEC; refresh(); }
}, 1000);
// ===== 미국 반도체 (Hyperliquid xyz 무기한 선물, 미국 정규장 종가 대비) =====
const US = [
  { id:'nvda', name:'엔비디아', tk:'NVDA', coin:'xyz:NVDA', logo:'NV', color:'#76b900' },
  { id:'amd',  name:'AMD',      tk:'AMD',  coin:'xyz:AMD',  logo:'AMD', color:'#000000' },
  { id:'sox',  name:'필라델피아반도체', tk:'SOX', api:'/api/sox', index:true, logo:'SOX', color:'#5b21b6', nologo:true },
  { id:'mu',   name:'마이크론', tk:'MU',   coin:'xyz:MU',   logo:'MU', color:'#0067b1' },
  { id:'sndk', name:'샌디스크', tk:'SNDK', coin:'xyz:SNDK', logo:'SD', color:'#c8102e' },
  { id:'intc', name:'인텔', tk:'INTC', coin:'xyz:INTC', logo:'IN', color:'#0068b5' },
  { id:'aapl', name:'애플', tk:'AAPL', coin:'xyz:AAPL', logo:'AP', color:'#111111', grid:'biggrid' },
  { id:'tsla', name:'테슬라', tk:'TSLA', coin:'xyz:TSLA', logo:'TS', color:'#cc0000', grid:'biggrid' },
  { id:'meta', name:'메타', tk:'META', coin:'xyz:META', logo:'MT', color:'#0866ff', grid:'biggrid' },
  { id:'googl', name:'구글', tk:'GOOGL', coin:'xyz:GOOGL', logo:'G', color:'#4285f4', grid:'biggrid' },
  { id:'msft', name:'마이크로소프트', tk:'MSFT', coin:'xyz:MSFT', logo:'MS', color:'#00a4ef', grid:'biggrid' },
  { id:'amzn', name:'아마존', tk:'AMZN', coin:'xyz:AMZN', logo:'AM', color:'#ff9900', grid:'biggrid' },
  { id:'spcx', name:'스페이스X', tk:'SPCX', coin:'xyz:SPCX', logo:'SX', color:'#000000', grid:'biggrid' },
  { id:'pltr', name:'팔란티어', tk:'PLTR', coin:'xyz:PLTR', logo:'PL', color:'#101113', grid:'biggrid' },
  { id:'orcl', name:'오라클', tk:'ORCL', lg:'ORCL.K', coin:'xyz:ORCL', logo:'OR', color:'#c74634', grid:'biggrid' },
];
function nyParts(ms){
  const p = {}; new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23',weekday:'short'})
    .formatToParts(new Date(ms)).forEach(x => p[x.type] = x.value);
  return p;
}
function nyToUtc(y,m,d,h,mi){            // 뉴욕 현지 시각 → UTC ms (서머타임 자동 반영)
  let g = Date.UTC(y,m-1,d,h,mi);
  for (let i=0;i<2;i++){ const p = nyParts(g); const asUtc = Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute); g += Date.UTC(y,m-1,d,h,mi) - asUtc; }
  return g;
}
function lastUsClose(){                   // 가장 최근 미국 정규장 마감(16:00 ET) 시각
  const now = Date.now();
  for (let k=0;k<8;k++){
    const p = nyParts(now - k*86400e3);
    if (p.weekday === 'Sat' || p.weekday === 'Sun') continue;
    const t = nyToUtc(+p.year,+p.month,+p.day,16,0);
    if (t <= now) return { t, label: `${+p.month}/${+p.day}` };
  }
  return null;
}
let usBase = null;
async function loadUsClose(){
  const b = lastUsClose(); if (!b) return;
  if (usBase && usBase.t === b.t && US.filter(s => !s.api).every(s => s.close)) return;
  usBase = b;
  await Promise.all(US.filter(s => !s.api).map(async s => {
    try{
      const r = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ type:'candleSnapshot', req:{ coin:s.coin, interval:'1m', startTime:b.t-5*60e3, endTime:b.t+60e3 } }) });
      const k = await r.json();
      const c = k.filter(x => x.t < b.t).pop();      // 16:00 직전 1분봉 종가
      if (c) s.close = Number(c.c);
    }catch(e){}
    renderUs(s);
  }));
}
function buildUs(){
  const card = s => `
    <div class="card" id="c-${s.id}">
      <div class="head">
        <div class="logo${s.nologo?' fb':''}" style="--c:${s.color}">${s.nologo?'':`<img src="https://ssl.pstatic.net/imgstock/fn/real/logo/stock/Stock${s.lg || s.tk + '.O'}.svg" alt="${s.name} 로고" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('fb');this.remove()">`}<span>${s.logo}</span></div>
        <div class="name">${s.name} <span style="font-size:15px;color:var(--muted);font-weight:600">${s.tk}</span></div>
      </div>
      <div class="src"><span class="dot stale"></span><span class="srcname">Hyperliquid</span>해외 실시간 추정가</div>
      <div class="price"><span class="v">—</span></div>
      <div class="chg"><span class="lbl"></span><span class="amt"></span><span class="sep">|</span><span class="pct"></span></div>
      ${s.api ? '' : `<canvas class="spark" data-coin="${s.coin}"></canvas>`}
    </div>`;
  ['usgrid','biggrid'].forEach(g => { const el = document.getElementById(g); if (el) el.innerHTML = US.filter(s => (s.grid || 'usgrid') === g).map(card).join(''); });
}
function renderUs(s){
  const card = document.getElementById('c-'+s.id); if (!card) return;
  card.querySelector('.chg .lbl').textContent = s.index ? '전일 종가 대비' : (usBase ? `${usBase.label} 종가 대비` : '');
  if (s.usd == null) return;
  const v = card.querySelector('.price .v');
  if (s.last != null && s.usd !== s.last) {
    v.classList.remove('flash-up','flash-down'); void v.offsetWidth;
    v.classList.add(s.usd > s.last ? 'flash-up' : 'flash-down');
    setTimeout(() => v.classList.remove('flash-up','flash-down'), 60);
  }
  v.textContent = (s.index ? '' : '$') + s.usd.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  s.last = s.usd;
  if (s.close){
    const diff = s.usd - s.close, pct = diff / s.close * 100;
    const cls = Math.abs(diff) < 0.005 ? 'flat' : diff > 0 ? 'up' : 'down';
    const arrow = cls==='up' ? '▲' : cls==='down' ? '▼' : '';
    const amt = card.querySelector('.chg .amt'), p = card.querySelector('.chg .pct');
    amt.className = 'amt ' + cls; p.className = 'pct ' + cls;
    amt.textContent = `${arrow} ${s.index ? '' : '$'}${Math.abs(diff).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
    p.textContent = `${pct>0?'+':''}${pct.toFixed(2)}%`;
  }
  const dot = card.querySelector('.dot');
  dot.classList.remove('stale','pulse'); void dot.offsetWidth; dot.classList.add('pulse');
}
async function refreshUs(){
  try{
    const res = await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ type:'metaAndAssetCtxs', dex:'xyz' }) });
    const [meta, ctxs] = await res.json();
    meta.universe.forEach((u,i) => { const s = US.find(x => x.coin === u.name); if (s){ const px = Number(ctxs[i].midPx || ctxs[i].markPx); if (px > 0) s.usd = px; } });
    US.forEach(renderUs);
  }catch(e){ document.querySelectorAll('#usgrid .dot').forEach(d => d.classList.add('stale')); }
}
buildUs();

// ===== 카드 미니 차트 (Hyperliquid 5분봉, 한국시간 18:00~06:00) =====
const SPK = {};
function sparkWindow(){
  const KSTs = 9*3600, now = Date.now()/1000, k = new Date((now+KSTs)*1000);
  let d = Date.UTC(k.getUTCFullYear(),k.getUTCMonth(),k.getUTCDate())/1000 - KSTs;
  if (k.getUTCHours() < 18) d -= 86400;
  const start = d + 18*3600; return { start, end: start + 12*3600 };
}
function sparkBase(coin){
  const s = STOCKS.find(x => x.coin === coin);
  if (s){ const cfg = cfgOf(s); return (cfg.close && fx) ? cfg.close / fx : null; }   // 한국: KRX 종가(원) ÷ 환율
  const u = US.find(x => x.coin === coin); return u ? u.close || null : null;          // 미국: 정규장 종가
}
function sparkLast(coin){
  const s = STOCKS.find(x => x.coin === coin) || US.find(x => x.coin === coin); return s ? s.usd : null;
}
function drawSpark(cv){
  const coin = cv.dataset.coin, d = SPK[coin]; if (!d || !d.pts.length) return;
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight; if (!W || !H) return;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  const c = cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,W,H);
  const pts = d.pts.slice(); const lp = sparkLast(coin); if (lp && Date.now()/1000 < d.end) pts.push([Date.now()/1000, lp]);
  const base = sparkBase(coin);
  let lo = Math.min(...pts.map(p=>p[1])), hi = Math.max(...pts.map(p=>p[1]));
  if (base){ lo = Math.min(lo, base); hi = Math.max(hi, base); }
  if (hi - lo < hi*0.0005){ const m=(hi+lo)/2; lo = m - hi*0.00025; hi = m + hi*0.00025; }
  const pad = 4, X = t => (t - d.start)/(d.end - d.start)*(W-6) + 1, Y = v => pad + (hi - v)/(hi - lo)*(H - pad*2);
  const st = getComputedStyle(document.documentElement);
  const up = st.getPropertyValue('--up').trim() || '#e5323b', dn = st.getPropertyValue('--down').trim() || '#2f6fe4';
  const yb = base ? Y(base) : H;
  if (base){ c.setLineDash([3,3]); c.strokeStyle = 'rgba(140,150,160,.55)'; c.lineWidth = 1; c.beginPath(); c.moveTo(0, Math.round(yb)+.5); c.lineTo(W, Math.round(yb)+.5); c.stroke(); c.setLineDash([]); }
  const path = () => { c.beginPath(); pts.forEach((p,i) => i ? c.lineTo(X(p[0]), Y(p[1])) : c.moveTo(X(p[0]), Y(p[1]))); };
  for (const [col, top, bot] of [[up, 0, yb], [dn, yb, H]]) {
    c.save(); c.beginPath(); c.rect(0, top, W, bot-top); c.clip();
    path(); c.lineTo(X(pts[pts.length-1][0]), yb); c.lineTo(X(pts[0][0]), yb); c.closePath();
    c.fillStyle = col + '1f'; c.fill();
    path(); c.strokeStyle = col; c.lineWidth = 1.6; c.lineJoin = 'round'; c.stroke(); c.restore();
  }
  const lx = X(pts[pts.length-1][0]), ly = Y(pts[pts.length-1][1]);
  c.fillStyle = (!base || pts[pts.length-1][1] >= base) ? up : dn; c.beginPath(); c.arc(lx, ly, 2.8, 0, 7); c.fill();
}
const drawSparks = () => document.querySelectorAll('canvas.spark').forEach(drawSpark);
async function loadSparks(){
  const w = sparkWindow();
  const coins = [...new Set([...document.querySelectorAll('canvas.spark')].map(c => c.dataset.coin).filter(Boolean))];
  for (const coin of coins) {
    try{
      const k = await (await fetch(API, { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ type:'candleSnapshot', req:{ coin, interval:'5m', startTime: w.start*1000, endTime: Math.min(Date.now(), w.end*1000) } }) })).json();
      SPK[coin] = { start: w.start, end: w.end, pts: k.filter(x => x.t/1000 >= w.start && x.t/1000 < w.end).map(x => [x.t/1000 + 300, +x.c]) };
    }catch(e){}
  }
  drawSparks();
}

let KOSPI = null;
async function loadKospi(){ try{ const j = await (await fetch('/api/kospi', { cache:'no-cache' })).json(); if (j.ok) KOSPI = j; }catch(e){} }
function renderEk(){
  const el = document.getElementById('ek'), ce = document.getElementById('ekc'); if (!el || !KOSPI || window.NIGHT_R == null) return;
  const k = kstNow(), today = k.toISOString().slice(0,10), h = k.getUTCHours();
  // 06:00~18:00에는 직전 야간장 등락률이 남아 있으므로, 그날 장이 끝났으면 전일 종가를 기준으로
  const openH = today === '2026-11-19' ? 19 : 18;   // 수능일은 야간장 19:00 개장
  const base = (h >= 6 && h < openH && KOSPI.date === today) ? KOSPI.prevClose : KOSPI.close;
  const r = window.NIGHT_R, v = base * (1 + r/100), c = v - base;
  el.textContent = v.toLocaleString('ko-KR', {minimumFractionDigits:2, maximumFractionDigits:2});
  const cls = c > 0 ? 'up' : c < 0 ? 'down' : '';
  ce.className = 'ekc ' + cls;
  ce.innerHTML = `<span>${c>0?'▲':c<0?'▼':''} ${Math.abs(c).toFixed(2)}</span><span>${r>0?'+':''}${r.toFixed(2)}%</span>`;
}
function kstNow(){ return new Date(Date.now() + 9*3600e3); }
