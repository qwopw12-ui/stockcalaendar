<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>증시 주요일정</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--ink:#16181d;--sub:#5d6470;--line:#e3e6eb;
  --hi:#d6303a;--hi-bg:#fdecee;--ipo:#1f6feb;--ipo-bg:#e8f0fe;--sel:#16181d;--today:#fff6d6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px}
header{padding:20px 24px 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
h1{margin:0;font-size:33px;letter-spacing:-.3px}
.src{color:var(--sub);font-size:12px;margin-top:4px}
.mnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.calhead h2{margin:0;font-size:20px}
.mright{display:flex;align-items:center;gap:6px;margin-left:auto}
.nav{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:#000;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.nav:hover:not(:disabled){background:var(--bg)}
.nav:disabled{color:#000;opacity:.45;cursor:default}
.mtabs{display:flex;gap:4px}
.mtab{height:34px;padding:0 14px;border-radius:8px;font-weight:700;font-size:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input{padding:8px 12px;border:1px solid var(--line);border-radius:8px;min-width:220px;font:inherit;background:#fff}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px;color:var(--sub)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{display:grid;grid-template-columns:900px minmax(320px,1fr);gap:16px;padding:0 24px 24px}
.cal{width:100%;max-width:900px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;align-self:start}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow div{padding:8px;text-align:center;font-size:12px;color:var(--sub);border-bottom:1px solid var(--line)}
.dow div:first-child{color:var(--hi)}.dow div:last-child{color:var(--ipo)}
.cell{height:184px;overflow:hidden;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 6px 8px;cursor:pointer;position:relative;background:#fff;transition:background .1s}
.cell:nth-child(7n){border-right:none}
.cell:hover{background:#fafbfc}
.cell.empty{background:#fbfbfc;cursor:default}

.cell.sel{outline:2px solid var(--sel);outline-offset:-2px;z-index:1}
.num{font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.num .cnt{font-weight:500;font-size:11px;color:var(--sub);background:var(--bg);border-radius:999px;padding:1px 7px}
.sun .num>span:first-child{color:var(--hi)}.sat .num>span:first-child{color:var(--ipo)}
.mini{margin-top:4px;display:flex;flex-direction:column;gap:2px}
.mini div{font-size:11px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
.mini .h{color:var(--hi);font-weight:500}
.mini .k{color:#fff!important;background:linear-gradient(90deg,#e00020,#ff5a00);font-weight:800;border-radius:4px;padding:1px 5px;box-shadow:0 1px 3px rgba(224,0,32,.35)}
.kcnt{font-size:11px;font-weight:800;color:#e00020;margin-right:4px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(224,0,32,.5)}50%{box-shadow:0 0 0 4px rgba(224,0,32,0)}}
.item.key{background:linear-gradient(90deg,#fff0ee,#fff);border-left:5px solid #e00020}
.item.key .t b{color:#c40018;font-weight:800;font-size:15px}
.tag.kb{background:#e00020;color:#fff;font-weight:800;font-size:12px;padding:2px 8px}
.chip.keychip{border-color:#e00020;color:#e00020;font-weight:700}
.chip.keychip.on{background:#e00020;color:#fff}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--sub);padding:8px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.legend .lk{color:#fff;background:linear-gradient(90deg,#e00020,#ff5a00);font-weight:800;border-radius:4px;padding:1px 6px;white-space:nowrap}
.legend .li{color:var(--ipo);font-weight:700;background:var(--ipo-bg);border-radius:4px;padding:0 5px;white-space:nowrap}
.legend .lh{color:var(--hi);font-weight:500;white-space:nowrap}
.num>span:last-child{display:flex;align-items:center}
.mini .i{color:#0f5c25;font-weight:800;background:#bdeccb;border:1px solid #2e9e50;border-radius:4px;padding:0 4px;box-shadow:0 1px 2px rgba(46,158,80,.25)}
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 110px);position:sticky;top:12px;align-self:start}
.side h2{margin:0;padding:16px 18px 10px;font-size:18px;border-bottom:1px solid var(--line)}
.side h2 small{font-weight:400;color:var(--sub);font-size:13px;margin-left:6px}
.list{overflow:auto;padding:6px 0}
.item{border-bottom:1px solid #f0f1f4;padding:10px 18px}
.item .t{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.item .t b{font-weight:500;flex:1}
.item.h .t b{color:var(--hi);font-weight:700}
.tag{font-size:11px;border-radius:4px;padding:1px 6px;white-space:nowrap;margin-top:1px}
.tag.ipo{background:#bdeccb;color:#0f5c25;font-weight:800;border:1px solid #2e9e50}
.tag.d{background:var(--bg);color:var(--sub)}
.item .c{display:none;white-space:pre-wrap;color:var(--sub);font-size:13px;line-height:1.6;margin-top:8px;padding:10px 12px;background:var(--bg);border-radius:8px}
.item.open .c{display:block}
.item.ipo .c{background:#fff;padding:0}
.item.ipo pre{white-space:pre-wrap;margin:0;background:var(--ipo-bg);border-radius:8px;padding:12px 14px;font:14px/1.7 "Noto Sans KR",sans-serif;color:var(--ink)}
.item.ipo .warn{margin-bottom:6px}
.ceo{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.ceo .cl{background:var(--ink);color:#fff;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700}
.item.ipo a.photo{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:var(--ipo);text-decoration:none;border:1px solid var(--ipo);border-radius:8px;padding:6px 10px}
.ceo a{margin-left:auto;color:var(--ipo);font-weight:500;text-decoration:none}
.btn{border:none;background:var(--ipo);color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.empty-msg{padding:24px 18px;color:var(--sub)}
.modal{position:fixed;inset:0;background:rgba(15,17,21,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.show{display:flex}
.box{background:#fff;border-radius:14px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.box h3{margin:0 0 4px;font-size:18px}
.box .meta{color:var(--sub);font-size:12px;margin-bottom:12px}
.box pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;font:15px/1.7 "Noto Sans KR",sans-serif;margin:0 0 12px;user-select:all}
.warn{background:#fff4e5;color:#8a5300;border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:12px}
.row{display:flex;gap:8px;justify-content:flex-end}
.note{color:var(--sub);font-size:11.5px;line-height:1.6;margin-top:10px}
.ipobar{padding:0 24px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ipobar span.l{font-size:12px;color:var(--sub);margin-right:4px}
@media (max-width:1260px){main{grid-template-columns:1fr}.side{position:static;max-height:none}}
@media (max-width:900px){
  main{grid-template-columns:1fr;padding:0 10px 16px}
  header,.ipobar{padding-left:12px;padding-right:12px}
  .cell{height:170px;padding:3px}
  .num .cnt{font-size:9px;padding:0 4px}.kcnt{font-size:9px;margin:0 2px 0 0}
  .mini div{font-size:9.5px;line-height:1.25}
  .side{position:static;max-height:none}
}

.calhead{display:flex;align-items:center;justify-content:center;padding:14px;border-bottom:1px solid var(--line)}
.mpick{display:flex;align-items:center;gap:14px}
.sq{width:34px;height:34px;border:1px solid #c9ccd2;border-radius:4px;background:#f4f5f7;color:#555;font-size:22px;line-height:1;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sq:hover:not(:disabled){background:#e9ebef;color:#000}
.sq:disabled{opacity:.4;cursor:default}
.msel{position:relative;display:flex;align-items:center;gap:8px;font-size:31px;font-weight:800;color:#2b2f36;cursor:pointer;letter-spacing:-.3px}
.msel .caret{font-size:17px;color:#666}
.msel select{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:16px}

.cell[data-d]{display:flex;flex-direction:column}
.cell .mini{flex:1;min-height:0;overflow:hidden}
.hbs{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px;padding-top:3px}
.hb{font-size:10.5px;font-weight:800;border-radius:4px;padding:1px 5px;white-space:nowrap}
.hb.kr{background:#16181d;color:#fff}
.hb.us{background:#3b4a63;color:#fff}
.hb.kr2{border:1px solid #16181d;color:#16181d;background:#fff}
.hb.us2{border:1px solid #3b4a63;color:#3b4a63;background:#fff}
.cell.off{background:#f1f2f4}
.cell.off .num>span:first-child{color:var(--hi)}
.hnote{margin:8px 18px 4px;padding:9px 12px;border-radius:8px;font-size:13px;background:#f1f2f4;color:var(--ink)}
.hnote b{margin-right:6px}
.hnote.kr{background:#16181d;color:#fff}
.hnote.us{background:#3b4a63;color:#fff}
@media (max-width:900px){.hb{font-size:9px;padding:0 3px}}

.cell.sat{background:#f3f7ff}
.cell.sun{background:#fff5f5}
.cell.sat:hover{background:#eaf1ff}
.cell.sun:hover{background:#ffeded}

.hname{font-style:normal;font-size:11px;font-weight:700;color:var(--hi);margin-left:5px}

.sin{flex-shrink:0;margin-right:3px;display:block}
.mini .i{display:flex;align-items:center}
.mini .i .it{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
</style>
</head>
<body>
<header>
  <div>
    <h1>증시 주요일정</h1>
  </div>
  <div class="tools">
    <input id="q" placeholder="종목·키워드 검색 (예: 실적, CPI, 엔비디아)">
    <button class="chip on" data-f="all">전체</button>
    <button class="chip keychip" data-f="key">🔥 핵심</button>
    <button class="chip" data-f="hi">주요일정</button>
    <button class="chip" data-f="ipo">상장·공모</button>
    <button class="chip" data-f="earn">실적</button>
    <button class="chip" data-f="global">해외</button>
  </div>
</header>
<div class="ipobar" id="ipobar"><span class="l">이달 신규상장</span></div>
<main>
  <section class="cal">
    <div class="calhead">
      <div class="mpick">
        <button class="sq" id="prevM" aria-label="이전 달">&lsaquo;</button>
        <label class="msel"><span id="mlabel"></span><span class="caret">▾</span><select id="msel" aria-label="월 선택"></select></label>
        <button class="sq" id="nextM" aria-label="다음 달">&rsaquo;</button>
      </div>
    </div>
    <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid" id="grid"></div>
  </section>
  <aside class="side">
    <h2 id="dayTitle"></h2>
    <div class="list" id="list"></div>
  </aside>
</main>
<div class="modal" id="modal">
  <div class="box">
    <h3 id="mTitle"></h3>
    <div class="meta" id="mMeta"></div>
    <div class="warn" id="mWarn" style="display:none"></div>
    <pre id="mText"></pre>
    <div class="row">
      <button class="btn ghost" id="mClose">닫기</button>
      <button class="btn" id="mCopy">복사</button>
    </div>
    <div class="note">유통물량 = 상장일 유통가능물량(공모주 포함), 구주주물량 = 그중 공모주를 뺀 기존 주주 물량. 금액·시가총액은 공모가 × 주식수, 비율은 상장예정주식수 대비. 수치는 38커뮤니케이션 공시 정리값을 합계 검산(유통+매각제한=상장주식수)해 반영했어요.</div>
  </div>
</div>

적화된 수소 사업 모델을 선보일 예정. 코오롱그룹 계열사들은 수소 시스템의 핵심 부품을 전시할 계획임.", "- 드론·도심항공모빌리티 박람회가 11월4일부터 6일까지 킨텍스에서 개최될 예정.\n- 행사 내용 : 2026 드론·도심항공모빌리티 박람회는 국내외 첨단 드론 및 UAM(도심항공교통) 분야의 혁신 기술과 최신 제품을 한눈에 조망하는 전문 비즈니스 전시회입니다. 글로벌 선도 기업들이 대거 참가하여 다채로운 솔루션을 선보이며, 비즈니스 성과 창출을 위한 1:1 수출 상담회, 전문가 세미나 및 워크숍, 대중 참여형 드론 체험 및 시연 행사 등 다각적인 프로그램이 동시 개최.\n- 행사 품목 : 항공 무인이동체(무인항공기, 드론 부품·소재, 활용 서비스, 데이터 수집·분석 기술 등), 도심항공교통(UAM)(UAM 시뮬레이션, 버티포트, 교통 관리 시스템(UTM), 운항 제어 솔루션 등)", "- 현지시간으로 11월4일부터 8일까지 미국 애리조나주 피닉스에서 '2026 미국면역항암학회(SITC 2026)'가 개최될 예정.\n- 이번 학회에서 루닛은 글로벌 진단·임상시험 서비스 기업 랩콥과 공동으로 수행한 AI 기반 공간 프로파일링을 통한 난소암 상동재조합복구결핍(HRD), 상동재조합복구정상(HRP) 간 조직학적 면역 특성 비교 연구를 선보일 예정. HLB이노베이션 미국 자회사 베리스모 테라퓨틱스(Verismo Therapeutics)는 KIR-CAR 플랫폼을 활용한 전임상 연구 결과를 포스터로 발표할 예정. 와이바이오로직스도 다중항체-사이토카인 융합체 플랫폼 ‘멀티앱카인’ 기반 면역항암제 연구 성과 2건을 포스터로 발표할 예정.", "- 국내 최대 로봇 전시회 '2026 로보월드'가 11월4~7일까지 경기도 고양 킨텍스에서 개최될 예정.\n- 산업통상부가 주최하고 한국AI·로봇산업협회, 한국로봇산업진흥원, 제어·로봇·시스템학회가 공동 주관하는 이번 전시회에는 17개국 390개사가 참가하며 총 1,150부스 규모로 운영될 예정임. 한편, 뉴로메카는 이번 전시에서 PSF를 적용한 휴머노이드 ‘에이르(EIR)’와 이동형 휴머노이드 ‘나미(NAMI)’를 선보일 예정이며, 삼현은 모터와 감속기, 제어기를 통합한 휴머노이드용 액추에이터 ‘엑슬론(AXLON)’을 전시한다고 알려짐.\n- 특히, 올해 로보월드 키워드는 ‘피지컬 AI’, ‘제조 AX(M.AX)’, ‘서비스용 로봇’이라며, 이번에는 휴머노이드 특별관과 푸드테크 특별관이 신설됐다고 설명. 아울러 엔비디아와 퀄컴은 국제로봇비즈니스 컨퍼런스에 참여하며, 엔비디아 파트너사인 어드밴텍은 전시 부스도 운영할 예정임. 휴머노이드 분야에서는 중국의 유니트리, 부스터로보틱스, 파시니와 일본의 화낙 등이 산업용 로봇 제품과 기술을 선보인다고 전해짐.", "- 한국전력이 11월4일부터 6일까지 광주 김대중컨벤션센터에서 'BIXPO 2026'(빛가람 국제전력기술 엑스포)을 개최할 예정.\n- 개막식 기조연설은 양자컴퓨팅 기업 '아이온큐'(IonQ) 공동창업자인 김정상 미국 듀크대 교수가 맡는다고 전해짐. 올해로 11회를 맞는 엑스포는 '혁신과 가능성의 만남'을 주제로 국내외 198개 기업이 선보이는 혁신 기술을 살펴보고, 에너지 산업의 최신 기술과 미래 발전 방향을 제시할 예정.", "- 국민의힘이 보전받은 대통령 선거 비용 397억원의 반환 여부가 달린 윤석열 전 대통령의 공직선거법 위반 사건의 항소심 선고가 11월4일 오후 2시에 이뤄질 예정.\n- 서울고법 형사2-1부(백승엽 황승태 김영현 고법판사)는 윤 전 대통령의 공직선거법 위반 혐의 2심 선고공판을 연다며, 선고 장면은 TV와 유튜브 등을 통해 생중계된다고 전해짐. 법원은 그간 사회적 관심이 높은 일부 사건에 대해 공공의 이익 등을 고려해 선고 생중계를 허가해 왔다고 알려짐.", "- SK하이닉스, 11월4일 장중 250,000주 규모 자기주식 매매 신청.", "- 오전 6시, 2026년 10월말 외환보유액이 발표될 예정.", "- GS리테일 3분기 실적발표 예정.\n- 25년3분기 연결기준 매출액 3.20조원(전년동기대비 + 과 현대차그룹은 11월9일 경기도 용인시 삼성전자 연수원 ‘더유니버스’에서 전영현 삼성전자 반도체 부문 부회장과 장재훈 현대차그룹 부회장 주재로 경영진 교류 행사를 개최할 예정.\n- 삼성전자가 현대차를 초청해 그간 사업 협력에 대해 감사를 표하는 자리로, 양대 그룹 최고경영자(CEO)들이 부부 동반으로 만나는 것도 협력을 넓히는 차원으로 전해짐. 양 사 부회장을 비롯해 핵심 사업을 이끄는 수장들이 한데 모이는 행사를 통해 기존 차량용 반도체와 전장(차량용 부품), 배터리를 넘어 휴머노이드 로봇을 중심으로 한 피지컬 인공지능(AI) 신사업으로 협력이 본격 확대될 것으로 알려짐.", "- 서울 삼성동 코엑스에서 국내 AI 스타트업 최고경영자(CEO)와 엔비디아 주요 임원 간 비공개 간담회가 11월9일 개최될 예정.\n- 이는 지난 10월 리사 수 AMD CEO가 방한해 국내 AI 반도체 기업들과 협력 방안을 논의한 데 이어 두 번째로, 디푸 탈라 로보틱스 및 에지 AI 부문 부사장과 조나단 코헨 응용 연구 부문 부사장 등이 참석한다고 알려짐. 특히, 국내에서는 AI 분야의 주요 스타트업이 참석할 예정인 가운데, 리벨리온, 퓨리오사AI, 딥엑스 등 AI 반도체 기업과 업스테이지 등 AI 모델 개발사, 엘리스그룹 등 AI 인프라 기업이 참석 예정 및 검토 중인 것으로 알려졌음. 한편, 젠슨 황 엔비디아 최고경영자(CEO)의 장녀 매디슨 황 엔비디아 수석이사의 방한 계획은 돌연 취소됐음.", "- 11월9일 오후 6시 에스엠 소속 그룹 엔시티 드림(NCT DREAM)은 정규 6집 'DREAM AFTER DREAM(드림 애프터 드림)'을 발매할 예정.\n- 이번 앨범은 데뷔 10주년을 맞아 선보이는 신보로, 타이틀곡 'Boogie Woogie(부기우기)'를 포함해 총 10곡이 수록됨. 타이틀곡은 1970년대 디스코 펑크 감성의 업템포 댄스곡이며 멤버 재민이 작사에 참여해 멤버 간의 연대와 지난 10년을 축하하는 메시지를 담은 것으로 알려짐.", "- SK하이닉스, 11월9일 장중 350,000주 규모 자기주식 매매 신청.", "- KDI(한국개발연구원) 경제동향 11월호 발간.", "- 두산 3분기 실적발표 예정.\n- 25년3분기 연결기준 매출액 4.45조원(전년동기대비 +14.79%), 영업이익 2,313.00억원(전년동기대비 +109.89%), 순이익 1,115.00억원(전년동기대비 흑자전환)을 기록한 바 있음.", "- 롯데칠성 3분기 실적발표 예정.\n- 25년3분기 연결기준 매출액 1.07조원(전년동기대비 +1.33%), 영업이익 918.00억원(전년동기대비 +16.64%), 순이익 620.00억원(전년동기대비 +39.32%)을 기록한 바 있음.", "- 메쎄이상 3분기 실적발표 예정.\n- 25년3분기 연결기준 매출액 219.46억원(전년동기대비 +58.95%), 영업이익 63.40억원(전년동기대비 +100.69%), 순이익 49.00억원(전년동기대비 +114.81%)을 기록한 바 있음.", "- 원익IPS 3분기 실적발표 예정.\n- 25년3분기 연결기준 매출액 2,684.38억원(전년동기대비 +45.42%), 영업이익 275.39억원(전년동기대비 +90.37%), 순이익 282.81억원(전년동기대비 +234.68%)을 기록한 바 있음.", "- 펌텍코리아 3분기 실적발표 예정.\n- 25년3분기 연결기준 매출액 976.72억원(전년동기대비 +14.61%), 영업이익 153.25억원(전년동기대비 +23.29%), 순이익 131.72억원(전년동기대비 +31.19%)을 기록한 바 있음.", "- 한국앤컴퍼니 3분기 실적발표 예정.\n- 25년3분기 연결기준 매출액 3,847.16억원(전년동기대비 +0.87%), 영업이익 1,370.75억원(전년동기대비 -0.14%), 순이익 1,297.33억원(전년동기대비 +7.49%)을 기록한 바 있음.", "- 한전KPS 3분기 실적발표 예정.\n- 25년3분기 연결기준 매출액 3,936.85억원(전년동기대비 +11.07%), 영업이익 474.31억원(전년동기대비 +12.96 SEC(유럽 주도), PVSEC(아시아 주도), IEEE PVSC(미국 주도) 등 세계 3대 태양광 총회가 약 4년에 한 번씩 공동으로 개최하는 전 세계 재생에너지 관련 최대 행사로 국내에서 열리는 것은 이번이 처음임.", "- 반도체 및 디스플레이 생산장비용 핵심부품에 대한 정밀가공, 특수표면처리 및 정밀 세정 서비스를 주요 사업으로 영위하는 영광와이케이엠씨가 16일 코스닥시장에 신규 상장할 예정. \n- 주관사 : 대신증권\n- 시장구분 : 코스닥\n- 확정공모가 : 11,000원\n- 총공모주식수 : 2,300,000주(상장예정주식수 14,459,531주)\n- 액면가 : 500원\n- 기업개요\n반도체 및 디스플레이 생산장비용 핵심부품에 대한 정밀가공, 특수표면처리 및 정밀 세정 서비스를 주요 사업으로 영위하는 업체. 정밀가공, 표면처리, 정밀세정 및 조립 공정을 일괄 수행할 수 있는 One-Stop 생산체계를 구축하고 있으며, 고객 맞춤형 솔루션 제공을 통해 품질 경쟁력과 고객만족도를 지속적으로 제공. \n주요 제품으로는 반도체 및 디스플레이용 CHAMBER, 반도체용 LID, 디스플레이용 SHADOW 등이 있음.", "- 16일(현지시간) 케빈 워시 Fed 의장이 연설할 예정.\n- 한국시간 : 17일 오전 2시", "- 16일(현지시간) 존 윌리엄스 뉴욕 연방준비은행 총재가 연설할 예정임.\n- 한국시간 : 16일 오후 11시5분", "- 11월16일 12월 결산법인의 2026년도 3분기 보고서 제출기한이 도래할 예정.\n- 반기ㆍ분기보고서를 연결기준으로 작성하여 제출하는 경우에는 최초 사업연도와 그 다음 사업연도에 한하여 제출기한이 15일(11월30일) 연장됨.", "- 이재명 대통령이 오는 16일부터 19일까지 필리핀 마닐라에서 개최되는 아세안 관련 정상회의에 참석하고, 중국 선전에서 열리는 APEC 정상회의에 참석한 뒤 귀국할 예정.\n- 이 대통령은 16일 한·아세안 정상회의에 참석해 지난해 제시한 한·아세안 포괄적 전략 동반자 관계 비전의 주요 이행 성과를 공유하고, 아세안과의 협력 강화 방안에 대해 논의할 예정. 17일 오전에는 아세안+3 정상회의에 참석해 식량과 에너지 분야 위기 대응 논의를 이끌고 미래 협력 방안을 제시할 예정. 18일에는 중국 선전으로 이동해 APEC 정상회의 공식 일정을 소화할 예정. 19일에는 APEC 정상회의 본회의에 참석할 예정.", "- 필리핀은 제49차 아세안 정상회의를 11월16~18일 개최할 예정. 아세안 회원국은 필리핀을 비롯해 인도네시아, 말레이시아, 태국, 싱가포르, 브루나이, 베트남, 라오스, 미얀마, 캄보디아, 동티모르 등 11개국임.\n- 이번 정상회의에는 트럼프 미국 대통령이 참여할 예정이며, 아세안 정상회의 기간에 미국·일본·인도·호주 4개국 안보 협의체인 쿼드(Quad) 정상회의도 개최될 예정.", "- 빅히트 뮤직 소속 그룹 투모로우바이투게더가 11월 16일 아홉 번째 미니앨범 ‘PERFECT STORM’을 발매할 예정.\n- 'PERFECT STORM'은 발매 전부터 세계 최대 음원 스트리밍 플랫폼 스포티파이에서 프리세이브(사전 저장) 30만 건을 돌파했으며, 10월 26일부터 28일까지 사흘 연속 스포티파이 '톱 10 카운트다운' 차트 1위를 차지하는 등 막강한 글로벌 음원 파워를 입증했음.", "- 1월16일부터 19일(현지시간)까지 영국 런던에서 유럽 최대 규모의 헬스케어 투자 행사인 '2026 제프리스 글로벌 헬스케어 콘퍼런스(Jefferies Global Healthcare Conference)'가 개최될 예정.\n- 글로벌 투자은행 제프리스가 주최하는 이번 행사에는 글로벌 제약·바이오 기업과 기관투자자들이 참석해 산업 동향과 투자 및 사업 협력 기회를 논의할 계획임. 국내에서는 지아이이노베이션이 참가해 주요 임상·전임상 파이프라인 중심의 후속 협의 및 기술이전 가능성을 모색하며, 리가켐바이오는 글로벌 투자자와 제약사를 대상으로 자체 개발 및 파트너링 투트랙 전략과 차세대 ADC 플랫폼 기반 신규 파이프라인을 소개할 예정임.", , 인버터 및 전력변환시스템에 이르는 OCI그룹의 통합 태양광 밸류체인을 선보인다고 알려짐.", "- 미국 자동차 제조사 제너럴모터스(GM)가 11월17일(현지시간) 115년간 유지해 온 뉴욕증권거래소(NYSE)를 떠나 기술주 중심의 거래소 나스닥으로 이전 상장할 예정.\n- 이번 결정은 GM이 전기자동차(EV), 자율주행, 차량용 소프트웨어 등 기술 투자를 확대해 온 행보와 관련된 것으로 풀이된다며, 이번 발표는 GM이 최근 뉴욕에서 첨단 운전자 보조 기능과 배터리 기술을 대거 탑재한 차세대 전기차 모델을 공개한 지 며칠 만에 나왔다고 알려짐. 시장에서는 전통적인 자동차 제조업체라는 이미지를 벗고, 기술 기업들과 같은 눈높이에서 기업 가치를 재평가받으려는 의도가 담긴 것으로 보고 있음. 한편, 이번 이전으로 GM은 나스닥 100 지수 편입 자격을 얻게 된다며, 이에 따라 지수를 추종하는 대형 패시브 자금과 인덱스 펀드들의 자연스러운 유입을 기대할 수 있게 됐음.", "- EU 집행위원회가 현지시간으로 11월17일 EU·유로존 성장률·인플레이션·재정 전망 등 경제전망을 발표할 예정.", "- 마이크로소프트(MS)가 현지시간으로 11월17일부터 20일까지 미국 샌프란시스코에서 연례 기술행사 '마이크로소프트 이그나이트 2026'을 개최할 예정.\n- 올해 행사의 화두는 AI를 실제 기업의 성과로 연결하는 '프론티어 트랜스포메이션(Frontier Transformation)'이며, 코파일럿과 AI 에이전트를 기업의 데이터와 애플리케이션, 업무 흐름에 적용하는 기술과 전략이 공개될 예정.", "- 군용 통신·정보시스템(MilCIS) 컨퍼런스가 11월17~19일(현지시간) 호주 캔버라에서 개최될 예정.\n- MilCIS(Military Communications and Information Systems Conference and Expo)는 군 통신 및 정보 시스템 분야를 다루는 대표적인 연례 국제 콘퍼런스 겸 전시회임.", "- 유럽 최대 규모의 우주 산업 전용 B2B 전시회 및 콘퍼런스인 Space Tech Expo Europe이 11월17~19일(현지시간) 독일 브레멘에서 개최될 예정.\n- 유럽 최대 규모의 B2B 우주 산업 전문 전시회로, 우주 항공 공학 및 첨단 기술 분야의 글로벌 리더들이 모이는 핵심 비즈니스 플랫폼임.", "- mRNA Health Conference가 현지시간으로 11월17일부터 19일까지 미국 보스턴에서 개최될 예정.\n- mRNA Health Conference는 mRNA 연구의 최신 발전 사항, 플랫폼 기술, 임상 개발 및 제조 등을 다루는 주요 포럼임.", "- 동원산업, 'HMM 노리는 동원, 2조 실탄 만든다' 보도에 대한 조회공시 답변 관련 재공시 기한(2026년11월17일)\n* 구체적인 사항이 결정되는 시점 등에 따라 공시 일정은 유동적입니다. 기한 내 제출되는 공시의 경우 DART or HTS내 종목 공시 부분을 확인해 주시기 바랍니다.", "- 에코볼트가 알에프텍으로 피흡수합병됨에 따라 2026년11월17일 상장폐지될 예정. 한편, 에코볼트 주권은 합병신주로 발행되는 알에프텍인 주권으로 코스닥시장에 상장될 예정.", "- 변경전 : 베노티앤알 -> 변경후 : 아인스팩씨엔에스\n- 상장일 : 2026-11-17", "- 알에프텍, 에코볼트(주) 흡수합병으로 이날 합병 신주가 상장될 예정.\n- (주)알에프텍 : 에코볼트(주) = 1 : 0.4053487(합병비율)", "- 덱스터, 주식병합으로 이날부터 거래정지 예정\n- 매매거래정지기간 : 2026년11월17일 ~ 2026년12월4일", "- 신주의 종류와 수 : 보통주 354,611주\n- 증자방식 : 제3자배정증자", "- 신주의 종류와 수 : 보통주 1,231,404주\n- 증자방식 : 제3자배정증자", "- 추가주식수 : 보통주 1,672,239주\n- 추가사유 : 국내사모 전환사채 전환", "- 추가주식수 : 보통주 19,184주 + 8,752주 + 1,300주 + 8,159주 + 1,322주 + 2,316주 + 사로 황 전 CEO와 함께 엔비디아를 세계적인 AI 반도체 기업으로 성장시키는 데 핵심적인 역할을 해 온 것으로 평가되고 있음.", "- 11월18~19일 중국 남부 선전에서 아시아태평양경제협력체(APEC) 정상회의가 개최될 예정.\n- 이번 APEC 정상회의의 주제 '아시아·태평양 공동체 건설, 공동 번영 촉진'이며, APEC 최고경영자(CEO) 정상회의 및 외교·무역 장관 합동회의도 함께 열릴 예정. 도널드 트럼프 미국 대통령과 시진핑 중국 국가주석의 정상회담이 예상되는 데다 블라디미르 푸틴 러시아 대통령까지 참여하는 사상 첫 미중러 3자 정상회담 가능성이 제기되고 있는 가운데, 북중·북미 정상회담 가능성과 한중·중일 관계 개선 여부까지 맞물리면서 이번 APEC은 아시아태평양의 경제협력을 넘어 미중 전략경쟁과 동북아 안보 정세를 가늠하는 계기가 될 전망임.", "- 김종철 경찰청장 후보자에 대한 인사청문회가 11월18일 오전 10시에 진행될 예정.", "- INDO DEFENCE EXPO & FORUM 2026이 현지시간으로 11월18~21일 인도네시아에 개최될 예정.\n- INDO Defence는 동남아시아 최대 규모의 방산 전시회로, 아시아의 주요 국가를 포함한 다양한 나라의 방산 관계자가 참여하는 국제 행사임.", "- 코람코라이프인프라리츠, 주유소 12곳 매각 보도에 대한 조회 공시 답변 재공시 기한(2026년11월18일)\n* 구체적인 사항이 결정되는 시점 등에 따라 공시 일정은 유동적입니다. 기한 내 제출되는 공시의 경우 DART or HTS내 종목 공시 부분을 확인해 주시기 바랍니다.", "- KDI(한국개발연구원) 26년 반기 경제전망\n- 앞서 8월 수정 전망에서는 올해 성장률을 3.2%, 내년 성장률을 2.2%로 제시했음. 이번에는 올해 성장률의 추가 상향 여부와 함께 내년 소비·투자 회복세에 대한 판단이 주목되고 있음. 한편, 반도체 호황이 내수로 얼마나 확산할지도 주요 관전 포인트로, KDI는 지난 12일 현안분석에서 내년에는 유가 상승의 부정적 영향이 점차 줄고 반도체 호황의 효과가 파급되면서 소비 개선세가 올해보다 확대될 것으로 전망.", "- 12시, 3분기 지역경제동향이 발표될 예정.", "- 12시, 3/4분기중 가계신용 잠정치가 발표될 예정.", "- 이동통신 장비 전문 제조업체 유캐스트가 18, 19일 이틀간 공모청약을 진행함.\n- 주관사 : 유진투자증권,신영증권\n- 시장구분 : 코스닥\n- 희망공모가 : 19,000원 ~ 23,000원\n- 총공모주식수 : 800,000주(상장예정주식수 5,888,910주)\n- 액면가 : 500원\n- 기업개요\n이동통신 장비 전문 제조업체. 이동통신 기지국 및 코어 네트워크 장비의 하드웨어와 소프트웨어 설계, 개발부터 완제품 조립 및 통합 유지보수에 이르는 전 과정을 자체 원천기술을 기반으로 일괄 수행. 주요 제품 및 솔루션은 공공, 국방, 스마트항만, 스마트팩토리 등 LTE 및 5G 프라이빗 네트워크(Private Network, 특화망) 구축에 필수적인 무선 기지국, 코어망 및 네트워크 통합관제시스템(EMS) 등으로 구성.", "- OLED 소재, 바이오형광 소재, 반도체 소재 등 고품질의 화학소재를 연구, 개발, 생산하는 정밀화학 업체 에스에프씨가 18, 19일 이틀간 공모청약을 진행함.\n- 주관사 : 미래에셋증권,한국투자증권,삼성증권\n- 시장구분 : 코스피\n- 희망공모가 : 31,600원 ~ 36,100원\n- 총공모주식수 : 5,000,000주(상장예정주식수 20,257,078주)\n- 액면가 : 500원\n- 기업개요\nOLED 소재, 바이오형광 소재, 반도체 소재 등 고품질의 화학소재를 연구, 개발, 생산하는 정밀화학 업체. OLED 분야에서는 디스플레이의 발광 효율, 수명, 색순도 및 구동 특성을 향상시키기 위한 유기 발광 소재를 연구·개발하고 있으며, 바이오 분야에서는 축적된 유기합성 및 형광소재 기술을 기반으로 분자진단, 생명과학 연구 및 바이오 분석 등에 활용되는 형광 소재를 개발. 반도체 분야에서는 반도체 제 , "- 유럽연합(EU)이 중국산 하이브리드 자동차 수입을 연간 35만대로 제한하는 세이프가드 조치를 오는 12월1일(현지시간) 시행할 예정.\n- 상한 적용 첫해에는 35만대가 적용되고 이후에는 상한이 매년 6%증가한다며, 이 조치는 4년간 적용된다고 전해짐. 양측은 WTO의 비차별 원칙을 준수하기 위해 중국산뿐만 아니라 모든 하이브리드자동차 수입에 상한선이 적용한다고 알려짐.", "- 실리콘밸리 휴머노이드 서밋 2026(Silicon Valley Humanoid Summit 2026)이 현지시간으로 12월1일부터 이틀간 개최될 예정.\n- 이번 행사에서는 테슬라의 옵티머스 휴머노이드 로봇과 FSD(완전자율주행) 시연이 라이브로 진행될 예정.", "- 이수페타시스, 대구국가산단에 7공장 신설…5천억원 투자 보도에 대한 조회공시 답변 관련 재공시 기한(2026년12월1일)\n* 구체적인 사항이 결정되는 시점 등에 따라 공시 일정은 유동적입니다. 기한 내 제출되는 공시의 경우 DART or HTS내 종목 공시 부분을 확인해 주시기 바랍니다.", "- 한전기술·한전KPS·대우건설·두산에너빌리티, 체코원전 우선협상대상자 선정 관련 보도 재공시 기한(2026년12월01일)\n* 구체적인 사항이 결정되는 시점 등에 따라 공시 일정은 유동적입니다. 기한 내 제출되는 공시의 경우 DART or HTS내 종목 공시 부분을 확인해 주시기 바랍니다.", "- 진에어, LCC 3사(에어부산 등) 합병 관련 보도에 대한 조회공시 답변 관련 재공시 기한(2026년12월1일)\n* 구체적인 사항이 결정되는 시점 등에 따라 공시 일정은 유동적입니다. 기한 내 제출되는 공시의 경우 DART or HTS내 종목 공시 부분을 확인해 주시기 바랍니다.", "- 한진칼, '호반그룹, 한진칼 최대주주 올라...기업결합 심사 중' 보도에 대한 조회공시 답변 관련 재공시 기한(2026년12월01일)\n* 구체적인 사항이 결정되는 시점 등에 따라 공시 일정은 유동적입니다. 기한 내 제출되는 공시의 경우 DART or HTS내 종목 공시 부분을 확인해 주시기 바랍니다.", "- 12시, 10월 온라인쇼핑동향이 발표될 예정.", "- AI 기반 공간데이터 인텔리전스(Data Intelligence) 업체 다비오가 1, 2일 이틀간 공모청약을 진행함.\n- 주관사 : 대신증권\n- 시장구분 : 코스닥\n- 희망공모가 : 12,300원 ~ 16,600원\n- 총공모주식수 : 1,000,000주(상장예정주식수 8,547,071주)\n- 액면가 : 100원\n- 기업개요\nAI 기반 공간데이터 인텔리전스(Data Intelligence) 업체. 자체 개발한 AI 공간데이터 분석 플랫폼 'Eartheye'를 중심으로 국토·공공, 국방·감시정찰(ISR), 임·농업, 공간 인프라·모빌리티 등 다양한 산업 분야에 동일한 핵심기술을 반복 적용하는 사업구조를 보유하고 있으며, 이에 따라 특정 산업이나 지역에 한정되지 않고 공공, 민간 및 해외 시장 전반으로 확장 가능한 사업구조를 갖추고 있음.\n주요 제품으로는 데이터구축 플랫폼(공간 인프라/모빌리티), 모니터링 플랫폼(국토/공공, 국방/감시정찰, 임업/농업) 등이 있음.", "- 신주의 종류와 수 : 보통주 9,817,118주\n- 증자방식 : 제3자배정증자", "- 1일(현지시간) 미국의 금융 서비스 기업인 S&P글로벌(마킷)이 발표하는 미국의 11월 제조업 구매관리자지수(PMI) 확정치가 발표됨.\n- 한국시간 : 1일 오후 11시45분", "- 1일(현지시간) 미국 노동부는 10월 구인 및 이직(JOLTs) 보고서를 발표할 예정임.\n- 한국시간 : 2일 오전 0시", "- 1일(현지시간) 美 상무부는 10월 건설지출(Construction Spending)을 발표함.\n- 한국시간 : 2일 오전 0시", "- 유로존) 11월 소비자물가지수(CPI) 예비치(현지시간)\n- 한국시간 : 1일 오후 7시", "- 유로존) 11월 제조업 PMI 확정치(현지시간)\n- 한국시간 : 1일 오후 6시", "- 독일) 11월 제조업  '2026-11-26':[['us','美 휴장','미국 증시 추수감사절(Thanksgiving Day) 휴장']],
 '2026-11-27':[['us2','美 조기폐장','미국 증시 추수감사절 다음날 조기폐장 (현지 13:00 마감)']],
 '2026-12-24':[['us2','美 조기폐장','미국 증시 크리스마스 이브 조기폐장 (현지 13:00 마감)']],
 '2026-12-25':[['kr','국내 휴장','성탄절 공휴일 — 국내 증시 휴장'],['us','美 휴장','미국 증시 크리스마스 휴장']],
 '2026-12-30':[['kr2','국내 폐장일','2026년 마지막 거래일 (31일 연말 휴장)']],
 '2026-12-31':[['kr','국내 휴장','연말 휴장일 — 국내 증시 휴장']],
 '2027-01-01':[['kr','국내 휴장','신정 공휴일 — 국내 증시 휴장'],['us','美 휴장',"미국 증시 신정(New Year's Day) 휴장"]],
 '2027-01-04':[['kr2','국내 개장일','2027년 첫 거래일 — 개장식으로 통상 10시 개장 (거래소 공지 전)']],
 '2027-01-18':[['us','美 휴장','미국 증시 마틴 루터 킹 데이 휴장']]
};
const HNAME={'2026-12-25':'크리스마스'};
const hkey=d=>`${cur}-${String(d).padStart(2,'0')}`;
let SIN_Y=10.8;
function calcSinY(){try{const c=document.createElement('canvas').getContext('2d');c.font='800 9.5px "Noto Sans KR", sans-serif';const m=c.measureText('신');if(m.actualBoundingBoxAscent){SIN_Y=+(7.5+(m.actualBoundingBoxAscent-m.actualBoundingBoxDescent)/2).toFixed(2)}}catch(e){}}
calcSinY();
const ipoKey=t=>{const m=t.match(/^(.+?) 신규 상장/);return m&&DATA.IPO[m[1]]?m[1]:null};
const isIpo=t=>/신규 상장|공모청약|상장\(|수요예측|보호예수|스팩/.test(t);
const KEYRE=/엔비디아|NVIDIA|애플(?!리)|Apple|마이크로소프트|Microsoft|구글|Google|알파벳|마이크론|Micron|샌디스크|SanDisk|AMD|인텔(?!리)|Intel(?!li)|블룸에너지|Bloom Energy|TSMC|ASML|브로드컴|Broadcom|코히런트|Coherent|루멘텀|Lumentum|코닝|Corning|FOMC|나스닥.{0,4}상장|CPI|PPI|소비자물가지수|생산자물가지수/i;
const FOREIGN=/^\s*(대만|독일|유로존|중국|中|일본|日|영국|프랑스|호주|캐나다|인도|홍콩)\s*\)?/;
const JPRATE=/(日|일본|BOJ).*(금리결정|기준금리)/;
const isKey=t=>/수능.*개장/.test(t)||JPRATE.test(t)||(KEYRE.test(t)&&!FOREIGN.test(t));
const isEarn=t=>/실적발표/.test(t);
const isGlobal=t=>/^(美|中|日|유로존|독일|영국|프랑스|대만|호주|캐나다|일본|중국|미국)|현지시간/.test(t);
let filter='all',query='',sel=null;
const today=new Date();const todayKey=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;const isToday=d=>cur===todayKey&&d===today.getDate();
function pass(it){
  if(filter==='hi'&&!it.h)return false;
  if(filter==='key'&&!isKey(it.t))return false;
  if(filter==='ipo'&&!isIpo(it.t))return false;
  if(filter==='earn'&&!isEarn(it.t))return false;
  if(filter==='global'&&!isGlobal(it.t))return false;
  if(query&&!(it.t+it.c).toLowerCase().includes(query))return false;
  return true;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderGrid(){
  const g=document.getElementById('grid');let h='';
  for(let i=0;i<FIRST_DOW;i++)h+='<div class="cell empty"></div>';
  for(let d=1;d<=LAST;d++){
    const dow=(FIRST_DOW+d-1)%7;const day=byDay[d];
    const items=day?day.items.filter(pass):[];
    const ipos=items.filter(x=>ipoKey(x.t));
    const keys=items.filter(x=>!ipoKey(x.t)&&isKey(x.t));
    const his=items.filter(x=>!ipoKey(x.t)&&!isKey(x.t)&&x.h);
    let mini=ipos.map(x=>`<div class="i"><svg class="sin" width="15" height="15" viewBox="0 0 15 15" aria-label="신규상장"><circle cx="7.5" cy="7.5" r="7.5" fill="#1f9d47"/><text x="7.5" y="${SIN_Y}" text-anchor="middle" font-size="9.5" font-weight="800" fill="#fff" font-family="Noto Sans KR,sans-serif">신</text></svg><span class="it">${esc(x.t.replace(' 신규 상장',''))} 상장</span></div>`).join('');
    mini+=keys.map(x=>`<div class="k" title="${esc(x.t)}">🔥 ${esc(x.t)}</div>`).join('');
    mini+=his.map(x=>`<div class="h" title="${esc(x.t)}">${esc(x.t)}</div>`).join('');
    const more=items.length-ipos.length-keys.length-his.length;
    if(more>0)mini+=`<div class="more">+${more}건</div>`;
    const hl=HOL[hkey(d)]||[];const krOff=hl.some(x=>x[0]==='kr');
    const hb=hl.map(x=>`<span class="hb ${x[0]}" title="${esc(x[2])}">${esc(x[1])}</span>`).join('');
    h+=`<div class="cell ${krOff?'off':''} ${dow===0?'sun':''} ${dow===6?'sat':''} ${isToday(d)?'today':''} ${d===sel?'sel':''} ${keys.length?'haskey':''}" data-d="${d}">
      <div class="num"><span>${d}${HNAME[hkey(d)]?`<em class="hname">${HNAME[hkey(d)]}</em>`:''}</span><span>${keys.length?`<span class="kcnt">🔥${keys.length}</span>`:''}</span></div><div class="mini">${mini}</div>${hb?`<div class="hbs">${hb}</div>`:''}</div>`;
  }
  const tail=(7-(FIRST_DOW+LAST)%7)%7;for(let i=0;i<tail;i++)h+='<div class="cell empty"></div>';
  g.innerHTML=h;
  g.querySelectorAll('.cell[data-d]').forEach(c=>c.onclick=()=>select(+c.dataset.d));
}
function select(d){sel=d;renderGrid();renderList();}
function renderList(){
  const day=byDay[sel];const dow='일월화수목금토'[(FIRST_DOW+sel-1)%7];
  const items=day?day.items.filter(pass):[];
  document.getElementById('dayTitle').innerHTML=`${MONTH}월 ${sel}일 (${dow})<small>${items.length}건</small>`;
  const L=document.getElementById('list');
  const hl=HOL[hkey(sel)]||[];
  const notice=hl.map(x=>`<div class="hnote ${x[0]}"><b>${esc(x[1])}</b> ${esc(x[2])}</div>`).join('');
  if(!items.length){L.innerHTML=notice+'<div class="empty-msg">해당 조건의 일정이 없어요.</div>';return}
  const sorted=[...items].sort((a,b)=>(!!ipoKey(b.t))-(!!ipoKey(a.t))||isKey(b.t)-isKey(a.t)||b.h-a.h);
  L.innerHTML=notice+sorted.map((it,i)=>{
    const k=ipoKey(it.t);
    const tags=k?'<span class="tag ipo">신규상장</span>':isEarn(it.t)?'<span class="tag d">실적</span>':isIpo(it.t)?'<span class="tag d">공모·상장</span>':isGlobal(it.t)?'<span class="tag d">해외</span>':'';
    if(k){
      const o=DATA.IPO[k];
      const warn=o.note?`<div class="warn">공모가 ${esc(o.note)}</div>`:'';
      const ceo=o.ceo?`<div class="ceo"><span class="cl">대표</span><b>${esc(o.ceo)}</b>${o.home?`<a href="https://${esc(o.home.replace(/^https?:\/\//,''))}" target="_blank" rel="noopener">홈페이지 ↗</a>`:''}</div>`:'';
      return `<div class="item h ipo open"><div class="t">${tags}<b>${esc(it.t)}</b><button class="btn" data-copy="${esc(k)}">복사</button></div><div class="c ipotxt">${ceo}${warn}<pre>${esc(o.text)}</pre>${o.ceo?`<a class="photo" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(k+' '+o.ceo.replace(/\s*\(.*\)/,'').split(',')[0]+' 대표')}" target="_blank" rel="noopener">📷 ${esc(o.ceo.replace(/\s*\(.*\)/,''))} 대표 사진 구글에서 보기 ↗</a>`:''}</div></div>`;
    }
    if(isKey(it.t))return `<div class="item key" data-i="${i}"><div class="t"><span class="tag kb">🔥 핵심</span><b>${esc(it.t)}</b></div><div class="c">${esc(it.c)}</div></div>`;
    return `<div class="item ${it.h?'h':''}" data-i="${i}"><div class="t">${tags}<b>${esc(it.t)}</b></div><div class="c">${esc(it.c)}</div></div>`;
  }).join('');
  L.querySelectorAll('.item:not(.ipo) .t').forEach(t=>t.onclick=()=>t.parentElement.classList.toggle('open'));
  L.querySelectorAll('.item.ipo .t').forEach(t=>t.onclick=e=>{if(e.target.dataset.copy)return;t.parentElement.classList.toggle('open')});
  L.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async e=>{
    e.stopPropagation();const pre=b.closest('.item').querySelector('pre');
    try{await navigator.clipboard.writeText(DATA.IPO[b.dataset.copy].text);b.textContent='복사됨 ✓'}
    catch(_){const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='선택됨 · Ctrl+C'}
    setTimeout(()=>b.textContent='복사',1500);
  });
}
function openIpo(k){
  const o=DATA.IPO[k];
  document.getElementById('mTitle').textContent=k+' 신규주 정리';
  document.getElementById('mMeta').textContent=`${o.date} 상장 · ${o.market} · 주관 ${o.lead}`+(o.ceo?` · 대표 ${o.ceo}`:'');
  const w=document.getElementById('mWarn');
  if(o.note){w.style.display='block';w.textContent='공모가 '+o.note+'. 공모가 확정 후 금액·시총이 바뀌어요.'}
  else w.style.display='none';
  document.getElementById('mText').textContent=o.text;
  document.getElementById('modal').classList.add('show');
}
document.getElementById('mClose').onclick=()=>document.getElementById('modal').classList.remove('show');
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.target.classList.remove('show')};
document.getElementById('mCopy').onclick=async e=>{
  const b=e.target;try{await navigator.clipboard.writeText(document.getElementById('mText').textContent);b.textContent='복사됨 ✓'}
  catch(_){const r=document.createRange();r.selectNodeContents(document.getElementById('mText'));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='선택됨 · Ctrl+C'}
  setTimeout(()=>b.textContent='복사',1500);
};
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');filter=c.dataset.f;renderGrid();renderList()});
document.getElementById('q').oninput=e=>{query=e.target.value.trim().toLowerCase();renderGrid();renderList()};
function renderIpoBar(){
  const bar=document.getElementById('ipobar');bar.innerHTML='<span class="l">이달 신규상장</span>';
  const list=Object.entries(DATA.IPO).filter(([k,o])=>o.date.slice(0,7)===cur).sort((a,b)=>a[1].date.localeCompare(b[1].date));
  if(!list.length){bar.insertAdjacentHTML('beforeend','<span class="l">— 아직 확정된 상장일이 없어요</span>');return}
  list.forEach(([k,o])=>{const b=document.createElement('button');b.className='chip';b.textContent=`${+o.date.slice(8)}일 ${k}`;
    b.onclick=()=>{select(+o.date.slice(8));openIpo(k)};bar.appendChild(b);});
}
function goMonth(k,day){loadMonth(k);select(day||(cur===todayKey?today.getDate():1));try{history.replaceState(null,'','#m'+k)}catch(e){}}
document.getElementById('prevM').onclick=()=>{const i=MKEYS.indexOf(cur);if(i>0)goMonth(MKEYS[i-1])};
document.getElementById('nextM').onclick=()=>{const i=MKEYS.indexOf(cur);if(i<MKEYS.length-1)goMonth(MKEYS[i+1])};
const msel=document.getElementById('msel');MKEYS.forEach(k=>{const o=document.createElement('option');o.value=k;o.textContent=k.replace('-','.');msel.appendChild(o)});msel.onchange=()=>goMonth(msel.value);
try{document.fonts&&document.fonts.ready.then(()=>{const o=SIN_Y;calcSinY();if(o!==SIN_Y&&cur){renderGrid()}})}catch(e){}
{const h=(location.hash||'').replace('#m','');goMonth(MKEYS.includes(h)?h:(MKEYS.includes(todayKey)?todayKey:MKEYS[0]));}
</script>
